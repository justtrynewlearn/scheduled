name: Scheduled Practice

on:
  schedule:
    - cron: "55 11 * * *"
    - cron: "00 12 * * *"

jobs:
  scheduled-test:
    runs-on: ubuntu-latest

    steps:
      - name: Show trigger information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"

      - name: Show current time
        run: date -u

      - name: Test completed
        run: echo "Scheduled test completed successfully"
